<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Chatbot</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="chat">
        <header class="chat__header">
            <div class="chat__avatar" aria-hidden="true">AI</div>
            <div>
                <h1>Chatbot</h1>
                <p>Asisten AI Anda</p>
            </div>
            <span class="chat__status"><span></span> Siap membantu</span>
        </header>

        <section class="chat__messages" id="messages" aria-live="polite" aria-label="Percakapan">
            <div class="message message--assistant">
                <div class="message__bubble">Halo! Ada yang bisa saya bantu?</div>
            </div>
        </section>

        <form class="chat__form" id="chat-form">
            <label class="sr-only" for="message-input">Tulis pesan</label>
            <textarea
                id="message-input"
                name="message"
                rows="1"
                placeholder="Ketik pesan Anda..."
                maxlength="4000"
                required
            ></textarea>
            <button type="submit" id="send-button" aria-label="Kirim pesan">
                <span>Kirim</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 2 11 13"></path>
                    <path d="m22 2-7 20-4-9-9-4Z"></path>
                </svg>
            </button>
            <p class="chat__hint">Enter untuk mengirim · Shift+Enter untuk baris baru</p>
        </form>
    </main>
    <script src="/scrip.js" defer></script>
</body>
</html>
